name: Public source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.14'
      - name: Install pinned uv
        run: python -m pip install uv==0.11.7
      - name: Install locked dependencies
        run: uv sync --frozen
      # Public unit/adapter tests do not build or run the Docker migration.
      - name: Public Python tests
        run: uv run --frozen pytest -q
      - name: Ruff
        run: uv run --frozen ruff check src tests scripts
