[project]
name = "postgres-migration-rehearsal"
version = "0.0.0"
description = "Test-only infrastructure for a local synthetic migration rehearsal."
requires-python = "==3.12.14"
dependencies = [
  "psycopg[binary]==3.3.4",
]

[dependency-groups]
dev = [
  "coverage==7.16.0",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "ruff==0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
